name: CI Climate Data Pipelines

on:
  push:
    branches: [wsl_ci]
  pull_request:
    branches: [wsl_ci]
  workflow_dispatch:

env:
  MODEL: ec_earth3
  VAR: tas
  EXP: historical
  FREQ: mon

jobs:
  run-raw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xarray dask pyarrow numpy requests

      - name: Prepare dataset directories
        run: |
          mkdir -p datasets/raw
          mkdir -p datasets/trusted
          mkdir -p datasets/delivery
          echo "Estrutura inicial de datasets:"
          find datasets -maxdepth 6 -type d

      - name: Run raw pipeline
        run: |
          export PYTHONPATH="${PYTHONPATH}:."
          python pipeline/main_pipeline.py --stage raw

      - name: Validate raw output
        run: |
          OUTPUT_DIR="datasets/raw/${MODEL}/${VAR}/exp=${EXP}/freq=${FREQ}"
          echo "Validando saída em $OUTPUT_DIR"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "diretório $OUTPUT_DIR não encontrado"
            exit 1
          fi
          echo "diretório de saída encontrado"

          if ! find "$OUTPUT_DIR" -type f -name "*.nc" | grep -q .; then
            echo "nenhum arquivo NetCDF encontrado"
            exit 1
          fi
          echo "arquivo NetCDF encontrado"

          if ! find "$OUTPUT_DIR" -type f -name "manifest*.json" | grep -q .; then
            echo "nenhum manifesto JSON encontrado"
            exit 1
          fi
          echo "arquivo manifesto localizado"

          if ! find "$OUTPUT_DIR" -type f -name "metrics_raw_*.json" | grep -q .; then
            echo "nenhum metrics_raw JSON encontrado"
            exit 1
          fi
          echo "arquivo metrics_raw localizado"

  run-trusted:
    runs-on: ubuntu-latest
    needs: run-raw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xarray dask pyarrow numpy

      - name: Prepare dataset directories
        run: |
          mkdir -p datasets/raw
          mkdir -p datasets/trusted
          mkdir -p datasets/delivery
          echo "Estrutura de datasets:"
          find datasets -maxdepth 6 -type d

      - name: Run trusted pipeline
        run: |
          export PYTHONPATH="${PYTHONPATH}:."
          python - <<EOF
          from pipeline.trusted_pipeline import process_variable_trusted_dask_only
          from config.variables_config import map_variaveis_meta
          from config.models_config import map_modelos_dir

          modelo_escolhido = map_modelos_dir["EC-Earth3"]
          variavel_escolhida = map_variaveis_meta["tas"]

          input_model = modelo_escolhido["nome_dir"]
          input_variable = variavel_escolhida["variable_id"]
          experiment_id = variavel_escolhida["experiment_id"]
          frequency = "mon"

          process_variable_trusted_dask_only(
              input_model=input_model,
              input_experiment_id=experiment_id,
              input_variable_id=input_variable,
              input_variant_label=variavel_escolhida["variant_label"],
              input_dir=f"datasets/raw/{input_model}/{input_variable}/exp={experiment_id}/freq={frequency}",
              output_dir=f"datasets/trusted/{input_model}/{input_variable}/exp={experiment_id}/freq={frequency}",
              map_transform_funcs=variavel_escolhida["transformations"],
              table_id="Amon"
          )
          EOF

      - name: Validate trusted output
        run: |
          OUTPUT_DIR="datasets/trusted/${MODEL}/${VAR}/exp=${EXP}/freq=${FREQ}"
          echo "Validando saída em $OUTPUT_DIR"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "diretório $OUTPUT_DIR não encontrado"
            exit 1
          fi
          echo "diretório de saída encontrado"

          if ! find "$OUTPUT_DIR" -type f -name "*.parquet" | grep -q .; then
            echo "nenhum arquivo Parquet encontrado"
            exit 1
          fi
          echo "arquivo Parquet encontrado"

          if ! find "$OUTPUT_DIR" -type f -name "metrics_trusted.json" | grep -q .; then
            echo "nenhum metrics_trusted.json encontrado"
            exit 1
          fi
          echo "arquivo metrics_trusted localizado"
