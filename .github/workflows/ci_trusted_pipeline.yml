name: CI Trusted Pipeline

on:
  push:
    branches: [wsl_ci]
  pull_request:
    branches: [wsl_ci]
  workflow_dispatch:

jobs:
  run-trusted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xarray dask pyarrow numpy

      - name: Prepare dataset directories
        run: |
          mkdir -p datasets/raw
          mkdir -p datasets/trusted
          mkdir -p datasets/delivery

          echo "Estrutura de datasets:"
          find datasets -maxdepth 6 -type d

      - name: Run trusted pipeline
        run: |
          export PYTHONPATH="${PYTHONPATH}:."
          python - <<EOF
          from pipeline.trusted_pipeline import process_variable_trusted_dask_only
          from config.variables_config import map_variaveis_meta
          from config.models_config import map_modelos_dir

          modelo_escolhido = map_modelos_dir["EC-Earth3"]
          variavel_escolhida = map_variaveis_meta["tas"]

          input_model = modelo_escolhido["nome_dir"]
          input_variable = variavel_escolhida["variable_id"]
          experiment_id = variavel_escolhida["experiment_id"]
          frequency = "mon"

          process_variable_trusted_dask_only(
              input_model=input_model,
              input_experiment_id=experiment_id,
              input_variable_id=input_variable,
              input_variant_label=variavel_escolhida["variant_label"],
              input_dir=f"datasets/raw/{input_model}/{input_variable}/exp={experiment_id}/freq={frequency}",
              output_dir=f"datasets/trusted/{input_model}/{input_variable}/exp={experiment_id}/freq={frequency}",
              map_transform_funcs=variavel_escolhida["transformations"],
              table_id="Amon"
          )
          EOF

      - name: Validate output
        run: |
          OUTPUT_DIR="datasets/trusted/ec_earth3/tas/exp=historical/freq=mon"
          echo "validando saída em $OUTPUT_DIR"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "diretório $OUTPUT_DIR não encontrado"
            exit 1
          fi

          # busca recursiva em year/month(/day)
          if ! find "$OUTPUT_DIR" -type f -name "*.parquet" | grep -q .; then
            echo "nenhum arquivo parquet encontrado em $OUTPUT_DIR (nem em subpastas)"
            exit 1
          fi

          # checa se pelo menos um arquivo de métricas foi gerado
          if ! find "$OUTPUT_DIR" -type f -name "metrics_trusted.json" | grep -q .; then
            echo "nenhum metrics_trusted.json encontrado"
          else
            echo "arquivo metrics_trusted.json localizado"
          fi

          echo "estrutura de saída validada com sucesso"